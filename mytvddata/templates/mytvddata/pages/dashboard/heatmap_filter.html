{% extends "mytvddata/cover/base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
  <!-- Main Title -->
  <div class="text-center mb-4">
    <h2 class="fw-bold text-primary border-bottom pb-2" style="font-size:2.5rem;">
      <i class="fas fa-notes-medical me-2"></i> Select Heatmap Filters
    </h2>
    <p class="text-muted" style="font-size:1.3rem;">
      Explore endemicity heatmaps by condition
    </p>
  </div>

  <!-- Filter Form -->
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0">
        <div class="card-body" style="font-size:1.2rem;">
          <form method="post" class="needs-validation" novalidate>
            {% csrf_token %}

            <!-- Subcomponent -->
            <div class="mb-4">
              <label for="subcomponent" class="form-label fw-bold text-secondary" style="font-size:1.2rem;">
                <i class="fas fa-layer-group me-2"></i> Disease
              </label>
              <select name="subcomponent" id="subcomponent" class="form-select form-select-lg">
                {% for sub in subcomponents %}
                  <option value="{{ sub.id }}">{{ sub.subcomponent_name }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Year -->
            <div class="mb-4">
              <label for="year" class="form-label fw-bold text-secondary" style="font-size:1.2rem;">
                <i class="fas fa-calendar-alt me-2"></i> Year
              </label>
              <input type="number" name="year" id="year" value="2020" class="form-control form-control-lg">
            </div>

            <!-- Source -->
            <div class="mb-4">
              <label for="source" class="form-label fw-bold text-secondary" style="font-size:1.2rem;">
                <i class="fas fa-database me-2"></i> Data Source
              </label>
              <select name="source" id="source" class="form-select form-select-lg">
                {% for src in sources %}
                  <option value="{{ src }}">{{ src }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Submit -->
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary btn-lg px-5">
                <i class="fas fa-chart-bar me-2"></i> Generate Heatmap
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
